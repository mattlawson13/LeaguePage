name: Auto-ingest Sleeper data

# Keeps .data/league.db current without anyone running the ingest script by
# hand. Sleeper is read-only and unauthenticated, so this needs no secrets.
# Vercel's own GitHub integration redeploys on every push to this branch,
# so a successful commit here is what actually gets fresher scores live.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ingest
        run: npm run ingest

      - name: Commit and push if the database changed
        run: |
          if git diff --quiet -- .data/league.db; then
            echo "No changes to .data/league.db, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .data/league.db
          git commit -m "Auto-ingest: refresh league data [skip ci]"
          git push
